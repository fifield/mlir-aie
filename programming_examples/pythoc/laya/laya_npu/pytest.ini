[pytest]
# Anchors the root here so collection never depends on the caller's directory or
# on configuration above laya_npu/. No cache is written into the source tree.
testpaths = tests
addopts = -p no:cacheprovider -m "not build and not npu"
markers =
    build: rebuilds all cores, blobs and graphs from source (~30 min) or uses LAYA_NPU_BUILD
    npu: runs on the NPU; uses LAYA_NPU_STAGE or stages from the build fixture
