# Each prototype <layer>/<layer>_pythoc.py is itself a lit test (carries
# `# REQUIRES:` and `# RUN:` directives at the top of the file). Override
# the parent mdv6/lit.local.cfg (which uses `.lit` for run_full_model.lit)
# back to `.py` so lit picks the prototypes up as tests.
config.suffixes = ['.py']
