import os

config.suffixes = ['.lit']

# Set the `mdv6_weights` feature when the trained-bf16 weights file is staged
# next to this lit.local.cfg. The weights file (~15 MB) is .gitignore'd to keep
# it out of source control; CI / developer setups stage it separately. Without
# weights, MDV6 emits NaN under random init and the PASS gate is meaningless,
# so run_full_model.lit gates on this feature via REQUIRES.
_this_dir = os.path.dirname(os.path.realpath(__file__))
if os.path.exists(os.path.join(_this_dir, "mdv6_bf16_weights.pt")):
    config.available_features.add("mdv6_weights")
