# MDV6 layers target AIE2P only.
if 'AIE2P' not in config.vitis_components:
    config.unsupported = True

# Surface trained-weights presence as a lit feature so the full-model test
# can REQUIRE it. The CI/runner stages mdv6_bf16_weights.pt next to the
# test before invoking lit.
import os
if os.path.exists(os.path.join(os.path.dirname(__file__), 'mdv6_bf16_weights.pt')):
    config.available_features.add('mdv6_weights')
