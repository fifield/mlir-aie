name: Build and Test aie4-dev

on:
  push:
    branches:
      - aie4-dev
  pull_request:
    branches:
      - aie4-dev
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit).
  group: ci-build-test-aie4-dev-${{ github.event.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  LM_LICENSE_FILE: 1757@xsjlicsrvip:2100@aiengine-eng
  VITIS: /proj/primebuilds/9999.0_PRIME_0801_1/installs/lin64/HEAD/Vitis
  CMAKE_ARGS: |
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DCMAKE_MODULE_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DXRT_ROOT=/opt/xilinx/xrt \
            -DAIE_ENABLE_PYTHON_PASSES=OFF \
            -DAIE_ENABLE_XRT_PYTHON_BINDINGS=ON \
            -DAIE_INCLUDE_INTEGRATION_TESTS=OFF
  # -j here to reduce the number of parallel chess jobs.
  LIT_OPTS: -sv --time-tests -j16 --timeout 600 --show-unsupported --show-excluded --filter-out slow_test
  # prebuilt mesimulator
  ME_ROOT: /proj/rdi/staff/jefff/aie4/pacifica-sim/cervino/aie4
  CERVINO_ROOT: /proj/rdi/staff/jefff/aie4/pacifica-sim/cervino

jobs:
  build-tests:
    name: Run Tests
    runs-on: xcorad-ubuntu22
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run commands
        run: |

          pip cache purge

          python3.10 -m venv aie-venv
          source aie-venv/bin/activate

          pip install -r python/requirements.txt
          pip install -r python/requirements_ml.txt
          pip install -r python/requirements_dev.txt
          HOST_MLIR_PYTHON_PACKAGE_PREFIX=aie pip install -r python/requirements_extras.txt
          pip install -r third_party/cert/requirements.txt

          # for mesimulator
          pip install bitstring toml cffi

          VERSION=$(utils/clone-llvm.sh --get-wheel-version)
          pip -q download mlir==$VERSION \
            -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/mlir-distro
          unzip -q mlir-*.whl

          sed -i 's/\t\tVITIS_DSPLIB_INCLUDE_DIR/\t\t#VITIS_DSPLIB_INCLUDE_DIR/g' cmake/modulesXilinx/FindVitis.cmake

          rm -rf build
          mkdir build
          pushd build

          export PATH=${VITIS}/aietools/bin:${VITIS}/bin:${VITIS}/gnu/microblaze/lin/bin:$PATH

          export LD_LIBRARY_PATH=$CERVINO_ROOT/ext/systemc/systemc-2.3.3/lib-linux64:$LD_LIBRARY_PATH
          export LD_LIBRARY_PATH=$CERVINO_ROOT/ext/Boost_1_72_0/boost_1_72_0/rdi/lib/gcc8.3.0/lnx64.o:$LD_LIBRARY_PATH
          export PYTHONPATH=$ME_ROOT/python:$ME_ROOT/applications:$PYTHONPATH

          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE=$(which python) \
            -DCMAKE_MODULE_PATH=$PWD/../cmake/modulesXilinx \
            -DLLVM_EXTERNAL_LIT=$(which lit) \
            -DCMAKE_INSTALL_PREFIX=$PWD/../mlir_aie \
            -DMLIR_DIR=$PWD/../mlir/lib/cmake/mlir \
            $CMAKE_ARGS

          ninja install
          ninja check-aie

          popd
