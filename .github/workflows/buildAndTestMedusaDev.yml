name: Build and Test medusa-dev

on:
  push:
    branches:
      - medusa-dev
  pull_request:
    branches:
      - medusa-dev
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ci-build-test-medusa-dev-${{ github.event.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  # This runner's /tmp is an 11G volume shared with everything else on the
  # box and routinely sits near full; the MLIR wheel download alone does not
  # fit. Keep pip's transient files on the workspace volume so the job does
  # not depend on free space outside its own workspace. PIP_CACHE_DIR is set
  # below with the other runner caches.
  TMPDIR: ${{ github.workspace }}/.tmp
  TMP: ${{ github.workspace }}/.tmp
  TEMP: ${{ github.workspace }}/.tmp

jobs:
  # ============================================================================
  # XRT Tests on NPU3 hardware
  # ============================================================================
  xrt-tests:
    name: XRT NPU3 Tests
    runs-on: ryzen-ai-npu3
    env:
      # Standalone aietools copy (aie_ml, aie2p, aie2ps, aie4, aie4a) taken from
      # /proj/aiebuilds/ryzen-ai/ryzen-ai-TA/main/ryzenai_2.0.0_2026_10_13_18759.
      # Its root is an aietools directory, so bin/ holds xchesscc and v++.
      VITIS: /proj/rdi/staff/jefff/aietools-aie4-20261013
      LM_LICENSE_FILE: 1757@172.19.220.188:2100@172.19.6.231
      XDG_CACHE_HOME: /scratch/github/actions-runner/_work/_temp/xdg-cache
      PIP_CACHE_DIR: /scratch/github/actions-runner/_work/_temp/pip-cache
      CCACHE_DIR: /scratch/github/actions-runner/_cache/ccache
      # The workspace is on the runner's local /scratch volume. Checkout
      # cleans this cache between runs instead of reusing the NFS home cache.
      NPU_CACHE_HOME: ${{ github.workspace }}/.npu-cache
      IRON_CACHE_HOME: ${{ github.workspace }}/.npu-cache

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive

      - name: Install and Pull Git LFS
        run: |
          git lfs install --local
          git lfs pull
          git submodule foreach git lfs pull

      - name: Setup Python venv and dependencies
        run: |
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$NPU_CACHE_HOME"
          python3.12 -m venv aie-venv
          source aie-venv/bin/activate
          python -m pip install --upgrade pip

          pip install -r python/requirements.txt
          pip install -r python/requirements_ml.txt
          pip install -r python/requirements_dev.txt
          pip install -r python/requirements_notebook.txt

          # Install the AIE4-capable Peano wheel pinned from Artifactory.
          pip install -r utils/aie4-peano-requirements.txt
          export PEANO_INSTALL_DIR="$(pip show llvm-aie | grep ^Location: | awk '{print $2}')/lnx64.o/tools/peano/"

          VERSION=$(utils/clone-llvm.sh --get-wheel-version)
          pip -q download mlir==$VERSION \
            -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/mlir-distro
          unzip -q mlir-*.whl

      - name: Check NPU Device
        run: |
          source /opt/xilinx/xrt/setup.sh
          xrt-smi examine

      - name: Build mlir-aie
        run: |
          source aie-venv/bin/activate
          source /opt/xilinx/xrt/setup.sh

          export PATH=$PATH:${VITIS}/bin
          export PEANO_INSTALL_DIR="$(pip show llvm-aie | grep ^Location: | awk '{print $2}')/lnx64.o/tools/peano/"
          sed -i 's/\t\tVITIS_DSPLIB_INCLUDE_DIR/\t\t#VITIS_DSPLIB_INCLUDE_DIR/g' cmake/modulesXilinx/FindVitis.cmake

          mkdir build
          pushd build

          export pybind11_DIR=`python -m pybind11 --cmakedir`

          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE=$(which python) \
            -DCMAKE_MODULE_PATH=$PWD/../cmake/modulesXilinx \
            -DLLVM_EXTERNAL_LIT=$(which lit) \
            -DCMAKE_INSTALL_PREFIX=$PWD/../mlir_aie \
            -DMLIR_DIR=$PWD/../mlir/lib/cmake/mlir \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DCMAKE_MODULE_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DXRT_ROOT=/opt/xilinx/xrt \
            -DAIE_ENABLE_PYTHON_PASSES=OFF \
            -DAIE_VITIS_COMPONENTS="AIE2;AIE2P;AIE4" \
            -DAIE_ENABLE_XRT_PYTHON_BINDINGS=ON \
            -DAIE_INCLUDE_INTEGRATION_TESTS=OFF

          ninja -j4 install
          popd

      - name: Run XRT NPU3 tests
        # Lit adds a per-test directory below TMPDIR and multiprocessing adds
        # an AF_UNIX socket below that. The workspace path is too long for the
        # socket, so use the shorter temp directory on the same /scratch volume.
        env:
          # Cap aiecc's internal per-design scheduler independently of lit's
          # test-level -j setting to stay within this runner's memory limit.
          AIECC_JOBS: "1"
          # Same cap for the Python/IRON external-kernel compiles, which run
          # before aiecc and default to os.cpu_count() workers.
          AIE_KERNEL_COMPILE_JOBS: "1"
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          source aie-venv/bin/activate
          source /opt/xilinx/xrt/setup.sh
          export PATH=$PATH:${VITIS}/bin
          export PEANO_INSTALL_DIR="$(pip show llvm-aie | grep ^Location: | awk '{print $2}')/lnx64.o/tools/peano/"

          pushd build
          export LIT_OPTS="-sv --time-tests -j8 --timeout 600 --show-unsupported --show-pass --order=random"
          ninja check-aie-cpp
          ninja check-aie
          ninja check-reference-designs
          popd
