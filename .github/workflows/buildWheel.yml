name: Build wheels for mlir-aie

on:
  # pull_request:
  workflow_dispatch:
  schedule:
    # At 04:00. (see https://crontab.guru)
    - cron: '0 4 * * *'
    
defaults:
  run:
    shell: bash
    
concurrency:
  # A PR number if a pull request and otherwise the commit hash. This cancels
  # queued and in-progress runs for the same PR (presubmit) or commit
  # (postsubmit).
  group: ci-build-wheel-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  LM_LICENSE_FILE: 1757@xsjlicsrvip:2100@aiengine-eng
  VITIS: /proj/primebuilds/HEAD_INT_daily_latest/installs/lin64/HEAD/Vitis
  LIT_OPTS: -sv --time-tests -j16 --timeout 600 --show-unsupported --show-excluded

jobs:
  build-repo:
    name: Build and upload mlir_aie wheels

    runs-on: xcorad-ubuntu22

    permissions:
      id-token: write
      contents: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.10"

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          ref: "aie4-dev"

      - name: Build mlir-aie
        run: |
            git config --global --add safe.directory $PWD
            MLIR_AIE_VERSION=$(git rev-parse --short HEAD)
            echo "Building mlir-aie version $MLIR_AIE_VERSION"

            python${{ matrix.python_version }} -m venv aie-venv
            source aie-venv/bin/activate

            pip install -r python/requirements.txt
            pip install -r python/requirements_ml.txt
            HOST_MLIR_PYTHON_PACKAGE_PREFIX=aie pip install -r python/requirements_extras.txt
            pip install -r third_party/cert/requirements.txt

            VERSION=$(utils/clone-llvm.sh --get-wheel-version)
            pip -q download mlir==$VERSION \
              -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/mlir-distro
            unzip -q mlir*.whl
            find mlir -exec touch -a -m -t 201108231405.14 {} \;

            export PATH=$VITIS/bin:$VITIS/aietools/bin:${VITIS}/gnu/microblaze/lin/bin:$PATH
            export MLIR_INSTALL_ABS_PATH=$PWD/mlir
            export MLIR_AIE_SOURCE_DIR=$PWD
            export WHEELHOUSE_DIR=$PWD/wheelhouse
            export CMAKE_MODULE_PATH=$PWD/cmake/modulesXilinx
            export XRT_ROOT=/opt/xilinx/xrt
            export AIE_PROJECT_COMMIT=$MLIR_AIE_VERSION
            export AIE_VITIS_COMPONENTS='AIE;AIE2;AIE2P;AIE4'
            export DATETIME=$(date +"%Y%m%d%H")

            pushd utils/mlir_aie_wheels

            pip install wheel auditwheel patchelf importlib_metadata
            CIBW_ARCHS=x86_64 pip wheel . -v -w $WHEELHOUSE_DIR --no-build-isolation

            popd

            auditwheel repair -w $WHEELHOUSE_DIR/repaired_wheel $WHEELHOUSE_DIR/mlir_aie*.whl --plat manylinux_2_35_x86_64 --exclude libcdo_driver.so --exclude libmlir_float16_utils.so

            # release
            cp -f wheelhouse/repaired_wheel/mlir_aie*whl /proj/rdi/staff/jefff/aie4/latest-wheels
